# Copy to "$(herdr plugin config-dir amberpixels.sidebar-plus)/rules.toml".
#
# Each [[project]] scopes its rules to one repository: `repo` matches the
# worktree's repo name, `path` its repo root (`~` is expanded). Leave both out
# to apply everywhere. The first project that applies wins.
#
# `match` gates the project: its steps run only when the regex matches the
# workspace name. Steps are regex replacements applied in order; `replace`
# uses Go's syntax, so write capture groups as ${1}.

[[project]]
repo = "orchard"
match = '^(orchard\.)?ORC-\d+[/-]'
steps = [
  { find = '^orchard\.', replace = '' },          # orchard.ORC-1250-... -> ORC-1250-...
  { find = '^ORC-(\d+)[/-]', replace = '${1}: ' },  # ORC-1234/... -> 1234: ...
  { find = '-', replace = ' ' },                    # fix-invoice -> fix invoice
]
