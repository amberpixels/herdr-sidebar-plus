id = "amberpixels.sidebar-plus"
name = "Sidebar Plus"
version = "0.1.0"
min_herdr_version = "0.9.5"
description = "Numbered agents, a two-digit agent jump, and per-project regex labels for sidebar names"
platforms = ["linux", "macos"]

[[build]]
command = ["go", "build", "-o", "bin/herdr-sidebar-plus", "./cmd/herdr-sidebar-plus"]

# Tokens are not restored after a server restart, so recompute them on startup.
[[startup]]
command = ["bin/herdr-sidebar-plus", "refresh"]

# Every event that can add, remove, rename, or reorder a workspace or an agent.
[[events]]
on = "workspace.created"
command = ["bin/herdr-sidebar-plus", "refresh"]

[[events]]
on = "workspace.renamed"
command = ["bin/herdr-sidebar-plus", "refresh"]

[[events]]
on = "workspace.moved"
command = ["bin/herdr-sidebar-plus", "refresh"]

[[events]]
on = "workspace.reordered"
command = ["bin/herdr-sidebar-plus", "refresh"]

[[events]]
on = "workspace.closed"
command = ["bin/herdr-sidebar-plus", "refresh"]

[[events]]
on = "worktree.created"
command = ["bin/herdr-sidebar-plus", "refresh"]

[[events]]
on = "tab.moved"
command = ["bin/herdr-sidebar-plus", "refresh"]

[[events]]
on = "tab.closed"
command = ["bin/herdr-sidebar-plus", "refresh"]

[[events]]
on = "pane.created"
command = ["bin/herdr-sidebar-plus", "refresh"]

[[events]]
on = "pane.closed"
command = ["bin/herdr-sidebar-plus", "refresh"]

[[events]]
on = "pane.moved"
command = ["bin/herdr-sidebar-plus", "refresh"]

[[events]]
on = "pane.exited"
command = ["bin/herdr-sidebar-plus", "refresh"]

[[events]]
on = "pane.agent_detected"
command = ["bin/herdr-sidebar-plus", "refresh"]

[[events]]
on = "workspace.updated"
command = ["bin/herdr-sidebar-plus", "refresh"]

[[events]]
on = "worktree.opened"
command = ["bin/herdr-sidebar-plus", "refresh"]

[[events]]
on = "worktree.removed"
command = ["bin/herdr-sidebar-plus", "refresh"]

# Herdr renames a space when its shell changes directory but fires no event for
# it. Focus events catch such names up; the README's chpwd hook does it at once.
[[events]]
on = "workspace.focused"
command = ["bin/herdr-sidebar-plus", "refresh"]

[[events]]
on = "pane.focused"
command = ["bin/herdr-sidebar-plus", "refresh"]

[[actions]]
id = "refresh"
title = "Refresh sidebar labels and numbers"
command = ["bin/herdr-sidebar-plus", "refresh"]

[[actions]]
id = "jump"
title = "Jump to agent by number"
command = ["bin/herdr-sidebar-plus", "open-jump"]

[[panes]]
id = "jump"
title = "Jump to agent"
placement = "popup"
width = 24
height = 5
command = ["bin/herdr-sidebar-plus", "jump"]
